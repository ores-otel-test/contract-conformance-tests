name: Deep test suite

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: ''
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Verify repository contract
        run: python scripts/verify_repository.py
      - name: Run deterministic deep suite
        env:
          PYTHONPATH: src
          DEEP_TEST_SEEDS: '0-49'
        run: python -m unittest discover -s tests -v
      - name: Check out the reviewed ores-interfaces source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ores-otel/ores-interfaces
          ref: 42f1f1d2565ea2138568eced076c2a0dffe0b9d7
          path: upstream/ores-interfaces
          persist-credentials: false
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: ''
      - name: Install the reviewed contract toolchain
        working-directory: upstream/ores-interfaces/contracts/rpc-retry/v1
        run: npm ci --ignore-scripts
      - name: Cross-check TypeSpec, Protobuf, and JSON Schema
        env:
          ORES_INTERFACES_ROOT: ${{ github.workspace }}/upstream/ores-interfaces
        run: node scripts/verify_rpc_retry_contract.mjs
