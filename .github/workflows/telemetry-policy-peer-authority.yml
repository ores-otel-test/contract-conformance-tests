name: ORES OTel telemetry peer-authority convergence

on:
  pull_request:
    paths:
      - 'contracts/telemetry-policy/**'
      - '.github/workflows/telemetry-policy-peer-authority.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/telemetry-policy/**'
      - '.github/workflows/telemetry-policy-peer-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-authority:
    uses: flags-2-env-test/contract-conformance-tests/.github/workflows/peer-authority-convergence.yml@ffaaa6bb025de65ea4440d78c61722adc94ac090
    with:
      typespec_path: contracts/telemetry-policy/main.tsp
      schema_path: contracts/telemetry-policy/authored.schema.json
      instances_path: contracts/telemetry-policy/instances
      expected_declarations_json: '["OresOtelTelemetryPolicy.TelemetryPolicyV1"]'
